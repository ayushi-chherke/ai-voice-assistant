<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>VOXA — AI Voice Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet"/>
<style>
  /* ── reset & base ─────────────────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #080b12;
    --surface:  #0e1320;
    --border:   #1c2438;
    --accent:   #00f5c4;
    --accent2:  #7b6cff;
    --danger:   #ff4d6d;
    --text:     #dde3f0;
    --muted:    #5a6380;
    --user-bg:  #131b2e;
    --ai-bg:    #0a1a14;
    --radius:   14px;
    --font-ui:  'Syne', sans-serif;
    --font-mono:'DM Mono', monospace;
  }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── noise overlay ────────────────────────────────────────────────────── */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none; z-index: 0; opacity: .5;
  }

  /* ── header ───────────────────────────────────────────────────────────── */
  header {
    width: 100%; max-width: 780px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 28px 24px 0;
    position: relative; z-index: 2;
  }
  .logo {
    font-size: 1.7rem; font-weight: 800; letter-spacing: -.03em;
    background: linear-gradient(110deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .logo span { font-weight: 400; opacity: .55; font-size: 1rem; letter-spacing: 0; -webkit-text-fill-color: var(--muted); }

  .status-pill {
    display: flex; align-items: center; gap: 7px;
    font-family: var(--font-mono); font-size: .72rem; color: var(--muted);
    background: var(--surface); border: 1px solid var(--border);
    padding: 5px 12px; border-radius: 99px;
  }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 8px var(--accent);
    animation: pulse 2s ease infinite;
  }
  .dot.off { background: var(--muted); box-shadow: none; animation: none; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

  /* ── chat area ────────────────────────────────────────────────────────── */
  #chat-wrap {
    width: 100%; max-width: 780px;
    flex: 1; display: flex; flex-direction: column;
    padding: 24px 16px 0;
    position: relative; z-index: 1;
    overflow: hidden;
  }

  #messages {
    flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 14px;
    padding: 4px 8px 20px;
    scrollbar-width: thin; scrollbar-color: var(--border) transparent;
  }
  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .msg {
    display: flex; gap: 12px; align-items: flex-start;
    animation: msgIn .3s cubic-bezier(.22,1,.36,1);
  }
  @keyframes msgIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:none} }

  .msg.user { flex-direction: row-reverse; }

  .avatar {
    width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: .8rem; font-weight: 700;
  }
  .msg.user  .avatar { background: linear-gradient(135deg,var(--accent2),#4a3fff); color:#fff; }
  .msg.ai    .avatar { background: linear-gradient(135deg,var(--accent),#00c49a); color:#080b12; }

  .bubble {
    max-width: 72%; padding: 13px 16px; border-radius: var(--radius);
    font-size: .93rem; line-height: 1.6; position: relative;
  }
  .msg.user .bubble {
    background: var(--user-bg);
    border: 1px solid var(--border);
    border-top-right-radius: 3px;
  }
  .msg.ai .bubble {
    background: var(--ai-bg);
    border: 1px solid rgba(0,245,196,.12);
    border-top-left-radius: 3px;
  }
  .bubble .meta {
    font-family: var(--font-mono); font-size: .65rem; color: var(--muted);
    margin-top: 6px; display: flex; gap: 10px; align-items: center;
  }
  .play-btn {
    background: none; border: 1px solid var(--border); color: var(--accent);
    padding: 2px 9px; border-radius: 99px; font-size: .65rem; cursor: pointer;
    font-family: var(--font-mono); transition: all .2s;
    display: flex; align-items: center; gap: 4px;
  }
  .play-btn:hover { background: rgba(0,245,196,.08); border-color: var(--accent); }

  /* typing indicator */
  .typing { display: flex; gap: 5px; align-items: center; padding: 14px 16px; }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
    animation: blink 1.2s ease infinite;
  }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,80%,100%{opacity:.15} 40%{opacity:1} }

  /* ── waveform ─────────────────────────────────────────────────────────── */
  #wave-canvas {
    width: 100%; height: 52px;
    display: none;
  }
  #wave-canvas.active { display: block; }

  /* ── controls ─────────────────────────────────────────────────────────── */
  .controls-wrap {
    width: 100%; max-width: 780px;
    padding: 12px 16px 28px;
    position: relative; z-index: 2;
  }

  .input-row {
    display: flex; gap: 10px; align-items: flex-end;
  }

  #text-input {
    flex: 1; background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 13px 16px; font-family: var(--font-ui); font-size: .93rem;
    resize: none; min-height: 50px; max-height: 150px;
    outline: none; transition: border-color .2s;
    scrollbar-width: thin;
  }
  #text-input:focus { border-color: var(--accent2); }
  #text-input::placeholder { color: var(--muted); }

  .btn {
    width: 50px; height: 50px; border-radius: var(--radius); border: none;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 1.2rem; transition: all .18s;
    flex-shrink: 0;
  }
  #send-btn {
    background: linear-gradient(135deg, var(--accent2), #4a3fff);
    color: #fff;
  }
  #send-btn:hover { transform: scale(1.06); filter: brightness(1.15); }
  #send-btn:disabled { opacity: .4; transform: none; }

  #mic-btn {
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text); position: relative;
  }
  #mic-btn:hover { border-color: var(--accent); color: var(--accent); }
  #mic-btn.recording {
    background: var(--danger); border-color: var(--danger); color: #fff;
    animation: recPulse 1s ease infinite;
  }
  @keyframes recPulse { 0%,100%{box-shadow:0 0 0 0 rgba(255,77,109,.4)} 50%{box-shadow:0 0 0 8px rgba(255,77,109,0)} }

  .hint {
    font-family: var(--font-mono); font-size: .68rem; color: var(--muted);
    text-align: center; margin-top: 10px; letter-spacing: .03em;
  }
  .hint kbd {
    background: var(--surface); border: 1px solid var(--border);
    padding: 1px 6px; border-radius: 4px; font-size: .65rem;
  }

  /* ── api key bar ──────────────────────────────────────────────────────── */
  .api-bar {
    width: 100%; max-width: 780px;
    display: flex; gap: 8px; align-items: center;
    padding: 16px 16px 0;
    position: relative; z-index: 2;
  }
  .api-bar label { font-family: var(--font-mono); font-size: .72rem; color: var(--muted); white-space: nowrap; }
  .api-bar input {
    flex: 1; background: var(--surface); border: 1px solid var(--border);
    color: var(--text); border-radius: 8px; padding: 7px 12px;
    font-family: var(--font-mono); font-size: .75rem; outline: none;
    transition: border-color .2s;
  }
  .api-bar input:focus { border-color: var(--accent2); }
  .api-bar button {
    background: var(--accent); color: #080b12; border: none;
    padding: 7px 14px; border-radius: 8px; font-family: var(--font-ui);
    font-size: .78rem; font-weight: 700; cursor: pointer; transition: filter .2s;
  }
  .api-bar button:hover { filter: brightness(1.1); }

  /* scrollbar hidden on chrome for textarea */
  #text-input::-webkit-scrollbar { width: 3px; }
  #text-input::-webkit-scrollbar-thumb { background: var(--border); }

  /* ── empty state ──────────────────────────────────────────────────────── */
  #empty {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    color: var(--muted); text-align: center;
    padding: 40px 20px;
  }
  #empty .icon { font-size: 3rem; opacity: .25; }
  #empty p { font-size: .88rem; max-width: 300px; line-height: 1.6; }

  /* responsive */
  @media(max-width:540px){
    .bubble { max-width: 88%; }
    .logo { font-size: 1.3rem; }
  }
</style>
</head>
<body>

<!-- ── Header ──────────────────────────────────────────────────────────────── -->
<header>
  <div class="logo">VOXA <span>/ AI Voice Chat</span></div>
  <div class="status-pill">
    <div class="dot" id="conn-dot"></div>
    <span id="conn-label">connecting…</span>
  </div>
</header>

<!-- ── API Key bar ─────────────────────────────────────────────────────────── -->
<div class="api-bar">
  <label>🔑 BACKEND URL</label>
<!-- Change to — auto-detect based on where the page is served from -->
<input id="backend-url" type="text" placeholder="https://your-backend.onrender.com" value=""/>  <button onclick="checkHealth()">Connect</button>
</div>


<!-- ── Chat area ───────────────────────────────────────────────────────────── -->
<div id="chat-wrap">
  <div id="messages">
    <div id="empty">
      <div class="icon">🎙</div>
      <p>Type a message or hold the mic button to speak.<br/>Your voice, powered by VOXA AI.</p>
    </div>
  </div>
  <canvas id="wave-canvas"></canvas>
</div>

<!-- ── Controls ────────────────────────────────────────────────────────────── -->
<div class="controls-wrap">
  <div class="input-row">
    <textarea id="text-input" rows="1" placeholder="Type something… or use the mic"></textarea>
    <button class="btn" id="mic-btn" title="Hold to record">🎙</button>
    <button class="btn" id="send-btn" title="Send (Enter)">➤</button>
  </div>
  <p class="hint">Press <kbd>Enter</kbd> to send · <kbd>Shift+Enter</kbd> newline · Hold 🎙 to record voice</p>
</div>

<!-- ──────────────────────────────────────────────────────────────────────────
     Script
     ────────────────────────────────────────────────────────────────────────── -->
<script>
// ── state ────────────────────────────────────────────────────────────────────
let history = [];         // [{role:"user",parts:["..."]}, ...]
let mediaRecorder = null;
let audioChunks   = [];
let isRecording   = false;
let analyser      = null;
let animFrame     = null;

const DEPLOYED_BACKEND = "https://ai-voice-assistant-8jyd.onrender.com";

document.getElementById("backend-url").value =
  window.location.hostname === "localhost" ||
  window.location.hostname === "127.0.0.1"
    ? "http://localhost:5000"
    : DEPLOYED_BACKEND;

const BACKEND = () =>
  document.getElementById("backend-url").value.trim().replace(/\/+$/, "");
// ── DOM refs ─────────────────────────────────────────────────────────────────
const messagesEl = document.getElementById("messages");
const textInput  = document.getElementById("text-input");
const sendBtn    = document.getElementById("send-btn");
const micBtn     = document.getElementById("mic-btn");
const emptyEl    = document.getElementById("empty");
const connDot    = document.getElementById("conn-dot");
const connLabel  = document.getElementById("conn-label");
const waveCanvas = document.getElementById("wave-canvas");
const waveCtx    = waveCanvas.getContext("2d");

// ── health check ──────────────────────────────────────────────────────────────
async function checkHealth() {
  connDot.className   = "dot off";
  connLabel.textContent = "checking…";
  try {
    const r = await fetch(`${BACKEND()}/health`, {signal: AbortSignal.timeout(3000)});
    if (r.ok) {
      connDot.className   = "dot";
      connLabel.textContent = "VOXA online";
        } else throw new Error();
  } catch {
    connDot.className   = "dot off";
    connLabel.textContent = "offline — start backend";
  }
}
checkHealth();
setInterval(checkHealth, 15000);

// ── messages ──────────────────────────────────────────────────────────────────
function addMessage(role, text, audioB64 = null, label = null) {
  if (emptyEl) emptyEl.remove();

  const wrap = document.createElement("div");
  wrap.className = `msg ${role}`;

  const av = document.createElement("div");
  av.className = "avatar";
  av.textContent = role === "user" ? "U" : "AI";

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.innerHTML = escapeHtml(text);

  const meta = document.createElement("div");
  meta.className = "meta";
  const ts = new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
  meta.textContent = ts;

  if (label) {
    const tag = document.createElement("span");
    tag.textContent = label;
    meta.appendChild(tag);
  }

  if (audioB64 && role === "ai") {
    const pb = document.createElement("button");
    pb.className = "play-btn";
    pb.innerHTML = "▶ replay";
    pb.onclick = () => playAudio(audioB64);
    meta.appendChild(pb);
    // auto-play
    playAudio(audioB64);
  }

  bubble.appendChild(meta);
  wrap.appendChild(av);
  wrap.appendChild(bubble);
  messagesEl.appendChild(wrap);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return wrap;
}

function addTyping() {
  const wrap = document.createElement("div");
  wrap.className = "msg ai";
  wrap.id = "typing-msg";
  wrap.innerHTML = `
    <div class="avatar">AI</div>
    <div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  messagesEl.appendChild(wrap);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}
function removeTyping() {
  const t = document.getElementById("typing-msg");
  if (t) t.remove();
}

function escapeHtml(t) {
  return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br/>");
}

// ── audio playback ────────────────────────────────────────────────────────────
function playAudio(b64) {
  const binary = atob(b64);
  const bytes  = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  const blob = new Blob([bytes], {type: "audio/wav"});  
  const url  = URL.createObjectURL(blob);
  const audio = new Audio(url);
  audio.play().catch(() => {});
}
// ── text chat ─────────────────────────────────────────────────────────────────
async function sendText() {
  const msg = textInput.value.trim();

  if (!msg) return;

  textInput.value = "";
  textInput.style.height = "auto";
  sendBtn.disabled = true;

  addMessage("user", msg);

  history.push({
    role: "user",
    parts: [msg]
  });

  addTyping();

  try {

    const res = await fetch(`${BACKEND()}/chat`, {
            method: "POST",
      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        message: msg,
        history: history.slice(0, -1),
        tts: true
      })
    });

    const data = await res.json();

    removeTyping();

    console.log(data);

    if (data.error) {
      addMessage("ai", `⚠ ${data.error}`);
      return;
    }

    addMessage(
      "ai",
      data.reply,
      data.audio_b64 || null
    );

    history.push({
      role: "model",
      parts: [data.reply]
    });

  } catch (e) {

    console.error(e);

    removeTyping();

    addMessage(
      "ai",
      "⚠ Could not reach backend. Is it running?"
    );

  } finally {

    sendBtn.disabled = false;
    textInput.focus();

  }
}
async function startRecording() {

try {

  const stream = await navigator.mediaDevices.getUserMedia({
    audio: {
      echoCancellation: true,
      noiseSuppression: true,
      autoGainControl: true
    }
  });

  // ── waveform setup ──
  const audioCtx = new AudioContext();

  const src = audioCtx.createMediaStreamSource(stream);

  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 256;

  src.connect(analyser);

  drawWave();

  waveCanvas.classList.add("active");

  // ── recorder ──
  mediaRecorder = new MediaRecorder(stream);

  audioChunks = [];

  mediaRecorder.ondataavailable = (e) => {

    if (e.data.size > 0) {
      audioChunks.push(e.data);
    }

  };

  mediaRecorder.onstop = async () => {

    const blob = new Blob(audioChunks, {
      type: "audio/webm"
    });

    await sendVoice(blob);

    stream.getTracks().forEach(track => track.stop());

  };

  mediaRecorder.start();

  isRecording = true;

  micBtn.classList.add("recording");

  micBtn.textContent = "⏹";

} catch (err) {

  console.error(err);

  alert("Microphone access denied.");

}

}
async function stopRecording() {

if (!mediaRecorder || mediaRecorder.state === "inactive") {
  return;
}

isRecording = false;

micBtn.classList.remove("recording");

micBtn.textContent = "🎙";

cancelAnimationFrame(animFrame);

waveCanvas.classList.remove("active");

mediaRecorder.stop();

}
async function sendVoice(blob) {

sendBtn.disabled = true;

addTyping();

const form = new FormData();

form.append("audio", blob, "recording.webm");

form.append("history", JSON.stringify(history));

form.append("tts", "true");

try {

  const res = await fetch(`${BACKEND()}/chat`, {    method: "POST",
    body: form
  });

  const data = await res.json();

  console.log(data);

  removeTyping();

  if (data.error) {

    addMessage("ai", `⚠ ${data.error}`);

    return;
  }

  addMessage(
    "user",
    `🎙 ${data.transcript}`,
    null,
    "voice"
  );

  history.push({
    role: "user",
    parts: [data.transcript]
  });

  addMessage(
    "ai",
    data.reply,
    data.audio_b64 || null
  );

  history.push({
    role: "model",
    parts: [data.reply]
  });

} catch (err) {

  console.error(err);

  removeTyping();

  addMessage(
    "ai",
    "⚠ Could not reach backend."
  );

} finally {

  sendBtn.disabled = false;

}

}

// ── waveform animation ────────────────────────────────────────────────────────
function drawWave() {
  const W = waveCanvas.offsetWidth;
  const H = waveCanvas.height;
  waveCanvas.width = W;
  const data = new Uint8Array(analyser.frequencyBinCount);

  function frame() {
    animFrame = requestAnimationFrame(frame);
    analyser.getByteTimeDomainData(data);
    waveCtx.clearRect(0, 0, W, H);
    waveCtx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--accent");
    waveCtx.lineWidth = 2;
    waveCtx.beginPath();
    const slice = W / data.length;
    let x = 0;
    for (let i = 0; i < data.length; i++) {
      const v = data[i] / 128;
      const y = (v * H) / 2;
      i === 0 ? waveCtx.moveTo(x, y) : waveCtx.lineTo(x, y);
      x += slice;
    }
    waveCtx.stroke();
  }
  frame();
}

// ── event listeners ───────────────────────────────────────────────────────────
sendBtn.addEventListener("click", sendText);

textInput.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendText(); }
});

textInput.addEventListener("input", () => {
  textInput.style.height = "auto";
  textInput.style.height = Math.min(textInput.scrollHeight, 150) + "px";
});

// hold mic to record
micBtn.addEventListener("mousedown",  () => { if (!isRecording) startRecording(); });
micBtn.addEventListener("mouseup",    () => { if (isRecording)  stopRecording();  });
micBtn.addEventListener("mouseleave", () => { if (isRecording)  stopRecording();  });
micBtn.addEventListener("touchstart", e => { e.preventDefault(); if (!isRecording) startRecording(); });
micBtn.addEventListener("touchend",   e => { e.preventDefault(); if (isRecording)  stopRecording();  });
</script>
</body>
</html>
